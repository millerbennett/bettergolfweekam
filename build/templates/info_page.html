{% extends "base.html" %}
{% block title %}{{ page.nav_title }} — {{ cfg.site_title }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ page.nav_title }}</h1>
  <p class="sub"><a href="{{ cfg.base_url }}/{{ cfg.tour_slug }}_tour_pages/readContent.aspx?id={{ page.id }}">View on amateurgolftour.net</a></p>
  <div class="mirrored">{{ page.html | safe }}</div>
</section>
{% endblock %}
