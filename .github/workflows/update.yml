name: Update mirror

# Cadence is deliberately conservative. `--mode auto` reads data/state.json and
# the schedule, then fetches only what is actually stale, so a typical run makes
# zero or one upstream request outside active events; nationals adds five boards.
# Cloudflare owns the timer; do not also enable a GitHub schedule. The site's
# robots.txt asks for a 10s crawl delay, which the scraper honours.
#
# Free-tier notes:
#  * Actions minutes are unlimited on public repos.
#  * Cloudflare Pages allows 500 deploys/month, so the deploy step is gated on
#    the data actually changing (see `changed` below) rather than running every
#    time the cron fires.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Crawl mode"
        default: auto
        type: choice
        options: [auto, daily, live, full, nationals]
      force:
        description: "Ignore freshness stamps"
        default: false
        type: boolean
      source:
        description: "Refresh initiator"
        default: manual
        type: choice
        options: [manual, cloudflare]
      scheduled_at:
        description: "Cloudflare tick time (ISO UTC; leave blank for manual runs)"
        default: ""
        type: string

run-name: "${{ inputs.source == 'cloudflare' && 'Cloudflare' || 'Manual' }} refresh (${{ inputs.mode }})"

concurrency:
  group: update-mirror
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prevent duplicate crawls
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_SOURCE: ${{ inputs.source }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python scheduler/guard.py

      # Freshness stamps are what stop every run from re-fetching everything.
      # They are deliberately not committed (that would be ~40 commits a day
      # from the cron alone), so they ride in the Actions cache instead. A cache
      # miss just means one slightly larger crawl, not a broken run.
      - name: Restore crawl state
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-

      - name: Pick crawl mode
        if: steps.guard.outputs.allowed == 'true'
        id: mode
        env:
          CRAWL_MODE: ${{ inputs.mode }}
          CRAWL_FORCE: ${{ inputs.force }}
          REFRESH_SOURCE: ${{ inputs.source }}
        run: |
          case "$CRAWL_MODE" in auto|daily|live|full|nationals) ;; *) exit 1 ;; esac
          if [ "$REFRESH_SOURCE" = cloudflare ]; then
            case "$CRAWL_MODE" in auto|daily) ;; *) exit 1 ;; esac
            CRAWL_FORCE=false
          fi
          echo "mode=$CRAWL_MODE" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_FORCE" = true ]; then echo "force=--force" >> "$GITHUB_OUTPUT"; fi

      - name: Crawl
        if: steps.guard.outputs.allowed == 'true'
        run: python -m scraper.crawl --mode ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.force }}

      - name: Save crawl state
        uses: actions/cache/save@v4
        if: always() && steps.guard.outputs.allowed == 'true'
        with:
          path: data/state.json
          key: crawl-state-${{ github.run_id }}

      - name: Detect changes
        if: steps.guard.outputs.allowed == 'true'
        id: diff
        run: |
          # state.json and meta.json are gitignored. heartbeat.json is
          # committed - it exists purely to keep the cron alive over a quiet
          # off-season - but it is not content, so it must not trigger a deploy.
          if git diff --quiet -- data/ ':!data/heartbeat.json'              && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data
        if: steps.guard.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          # A manual dispatch can overlap the cron; rebase rather than fail.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main
          done
          exit 1

      - name: Render site
        # A manual run always redeploys: it is the escape hatch if a previous
        # deploy failed after its data was already committed, which would
        # otherwise leave every later run seeing "no change" and never retrying.
        if: steps.diff.outputs.changed == 'true' || (inputs.source != 'cloudflare' && steps.guard.outputs.allowed == 'true')
        run: python -m build.render --site-url "${{ vars.SITE_URL || 'https://bettergolfweekam.pages.dev' }}"

      - name: Deploy to Cloudflare Pages
        # A manual run always redeploys: it is the escape hatch if a previous
        # deploy failed after its data was already committed, which would
        # otherwise leave every later run seeing "no change" and never retrying.
        if: steps.diff.outputs.changed == 'true' || (inputs.source != 'cloudflare' && steps.guard.outputs.allowed == 'true')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CF_PAGES_PROJECT || 'bettergolfweekam' }} --branch=main

      - name: Summary
        if: always() && steps.guard.outputs.allowed == 'true'
        run: |
          {
            echo "### Mirror update"
            echo ""
            echo "- mode: \`${{ steps.mode.outputs.mode }}\`"
            echo "- content changed: \`${{ steps.diff.outputs.changed }}\`"
            echo ""
            echo '```'
            cat data/meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report upstream failures
        if: steps.guard.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors = json.loads(Path('data/meta.json').read_text())['errors']
          if errors:
              raise SystemExit(f'Crawl finished with {len(errors)} upstream errors; see the summary.')
          PY
